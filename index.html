<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Odin sign-up form</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="side-img">
            <div class="logo">
                <img src="" alt="Odin logo.">
                <h1>ODIN</h1>
            </div>

            <p>Photo by <a href="">Haile West</a> on <a href="">Unsplash</a></p>
        </div>

        <div class="main">
            <div class="inspirational-message">
                <p>This is not a real online service! You know you need something like this in your lifeto help you realize your deepest dreams. Sign up <em>now</em> to get started.</p>

                <p>You <em>know</em> you want to.</p>
            </div>

            <div class="form-section">
                <h2>Let's do this!</h2>
                
                <form action="" id="sign-up">
                    <div class="name">
                        <div class="first-name">
                            <label for="first-name">FIRST NAME</label>
                            <input type="text" name="first-name" id="first-name">
                        </div>

                        <div class="last-name">
                            <label for="last-name">LAST NAME</label>
                            <input type="text" name="last-name" id="last-name">
                        </div>
                    </div>

                    <div class="contact-info">
                        <div class="email">
                            <label for="email">EMAIL</label>
                            <input type="email" name="email" id="email">
                        </div>

                        <div class="phone">
                            <label for="phone">PHONE NUMBER</label>
                            <input type="tel" name="phone" id="phone">
                        </div>
                    </div>

                    <div class="password">
                        <div class="password">
                            <label for="password">PASSWORD</label>
                            <input type="password" name="password" id="password">
                        </div>

                        <div class="confirm-password">
                            <label for="confirm-password">CONFIRM PASSWORD</label>
                            <input type="password" name="confirm-password" id="confirm-password">
                        </div>
                    </div>
                </form>
            </div>

            <div class="account-creation">
                <button type="submit" form="sign-up">CREATE ACCOUNT</button>
                <p>Already have an account? <a href="">Log in</a></p>
            </div>
        </div>
    </div>
</body>
</html>
